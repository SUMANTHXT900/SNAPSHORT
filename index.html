<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapshort</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Inline theme detection — runs before first paint.
      // Priorities: 1. localStorage override  2. OS preference  3. light default
      (function () {
        var stored = localStorage.getItem("snapshort-theme");
        var osDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || stored === "light") {
          document.documentElement.className = stored;
        } else {
          document.documentElement.className = osDark ? "dark" : "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
